; PlatformIO project config — Calibrated Edge Classifier on ESP32
;
; Two build environments, one per phase. Pick the environment in the PlatformIO
; toolbar (Project Tasks) before Upload:
;   * phase0_miccheck — quick mic check (run this FIRST when the cable arrives)
;   * phase1_capture  — labeled audio window capture (the current phase)
;
; board: esp32dev is the generic ESP32 WROOM DevKit target and works for almost
;        all classic ESP32 dev boards. If yours differs (DOIT DevKit V1,
;        NodeMCU-32S, WROVER), change `board` — pin numbers stay the same.
;
; platform pinned to espressif32 6.x (= arduino-esp32 core 2.0.x) so the timer
; API used in Phase 1 matches. (Core 3.x changed timerBegin/timerAlarm.)

[platformio]
default_envs = phase1_capture

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
build_flags =
    -D CORE_DEBUG_LEVEL=0

[env:phase0_miccheck]
monitor_speed = 115200
build_src_filter = -<*> +<phase0_miccheck.cpp>

[env:phase1_capture]
monitor_speed = 921600
build_src_filter = -<*> +<phase1_capture.cpp>
