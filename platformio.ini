; PlatformIO project config — Calibrated Edge Classifier on ESP32
;
; board:  esp32dev is the generic ESP32 WROOM DevKit target and works for almost
;         all classic ESP32 dev boards. If yours is different (e.g. DOIT DevKit V1,
;         NodeMCU-32S, WROVER), change `board` accordingly — pin numbers stay the same.
;
; platform version note (matters for Phase 1, not Phase 0):
;   espressif32 @ 6.x  -> arduino-esp32 core 2.0.x  -> legacy I2S built-in-ADC works.
;   For arduino-esp32 core 3.x you'd switch to the community `pioarduino` platform.
;   Pinning 6.x here keeps the I2S-ADC sampling path available for Phase 1.

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=0
